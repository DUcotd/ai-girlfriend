name: CI

# 触发：push 到 main 与所有 PR。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消上一次未完成的运行，省 CI 额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20：满足 backend engines（>=18），且是当前 LTS，兼容 Next.js 16 / React 19。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # lockfile 已入库（见 .gitignore 顶部说明），用 npm ci 严格按锁文件安装：
      # 版本可复现，且锁文件与 package.json 不一致时会直接失败（早暴露）。
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

  frontend:
    name: frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20：满足 backend engines（>=18），且是当前 LTS，兼容 Next.js 16 / React 19。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 同 backend：lockfile 已入库，npm ci 严格安装。
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx vitest run
